version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    container_name: fb_scraper_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-node
    restart: unless-stopped

  backend-node:
    build:
      context: ./backend-node
    container_name: fb_scraper_backend_node
    volumes:
      - ./backend-node:/app
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=mongodb://mongodb:27017/fbscraper
      - SECRET_KEY=super-secret-development-key-change-in-production
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:6-jammy
    container_name: fb_scraper_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
